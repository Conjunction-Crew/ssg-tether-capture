[package]
name = "ssg-app"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
name = "ssg_app"

[dependencies]
bevy = { workspace = true, features = ["default", "debug", "jpeg", "basis-universal", "ktx2", "zstd_rust"] }
bevy_egui = { workspace = true }
egui_plot = { workspace = true }
avian3d = { workspace = true }
ssg-sim = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
brahe = { workspace = true }
nalgebra = { workspace = true }
rfd = { workspace = true }
arboard = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
ssg-sim = { workspace = true, features = ["test-support"] }
egui_kittest = { version = "=0.34.3", features = ["wgpu", "snapshot"] }

[[bin]]
name = "ssg_tether_capture"
path = "src/main.rs"
test = false
bench = false

[package.metadata.bundle]
name = "SSG Tether Capture"
identifier = "com.conjunction-crew.ssg-tether-capture"
resources = ["assets"]
short_description = "Orbital tether capture simulation and mission planning."
icon = ["assets/logo/icon.icns"]
