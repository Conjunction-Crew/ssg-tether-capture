[package]
name = "ssg-sim"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = []
test-support = []

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_log", "bevy_state", "bevy_asset", "bevy_scene", "bevy_mesh", "multi_threaded", "async_executor"] }
avian3d = { workspace = true }
brahe = { workspace = true }
nalgebra = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
csv = { workspace = true }
parquet = { version = "=60.1.0", default-features = false }
# P11 Run 0 probe only (never merged): round C calls libm from tail_lag_weight;
# the probe test uses it for the libm column of the function table.
libm = "0.2.16"

[dev-dependencies]
ssg-sim = { path = ".", features = ["test-support"] }
# Generates the published JSON Schema files from the plan types (design D10); test only.
schemars = "=1.2.3"
