# Exact toolchain pin (the 2024 edition needs Rust 1.85+) so CI and contributors
# build and lint with the same compiler and get the same clippy results.
# Dependabot does not bump this file: raise it by hand in a PR that also fixes
# any new lints. rustfmt and clippy are installed for both contributors and CI.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
