[workspace]
members = ["crates/ssg-app", "crates/ssg-sim", "crates/ssg-sim-cli"]
default-members = ["crates/ssg-app"]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Conjunction-Crew/ssg-tether-capture"
homepage = "https://conjunction-crew.github.io/ssg-tether-capture/"
publish = false
description = "Orbital tether capture simulation and mission planning."

[workspace.dependencies]
bevy = { version = "0.18.0", default-features = false }
avian3d = { version = "0.6.1", default-features = false, features = ["simd", "parallel", "3d", "f64", "parry-f64", "xpbd_joints", "collider-from-mesh", "bevy_scene"] }
bevy_egui = "0.39.1"
egui_plot = "0.34.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
csv = "1.4.0"
chrono = "0.4.41"
brahe = "1.1.4"
nalgebra = "0.34.1"
rfd = "0.17"
arboard = "3"
dirs = "7"
ssg-sim = { path = "crates/ssg-sim" }

[patch.crates-io]
bevy = { git = "https://github.com/Conjunction-Crew/ssg-bevy.git", rev = "f93dee9e299d46e2af62a8d753fa62227ee3c802" }
