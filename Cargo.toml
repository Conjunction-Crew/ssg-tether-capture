bevy_reflect_derive = { git = "https://github.com/Conjunction-Crew/ssg-bevy.git", rev = "f93dee9e299d46e2af62a8d753fa62227ee3c802" }
bevy_a11y = { git = "https://github.com/Conjunction-Crew/ssg-bevy.git", rev = "f93dee9e299d46e2af62a8d753fa62227ee3c802" }
bevy_app = { git = "https://github.com/Conjunction-Crew/ssg-bevy.git", rev = "f93dee9e299d46e2af62a8d753fa62227ee3c802" }
