# The platform-math guard, Part 1 (scripts/check_platform_math.sh).
# The simulation must give the same bits on Linux, macOS and Windows. The `std`
# float methods below call each platform's own math library, and these brahe
# items compute with it (or with C code), so none of them may appear in the
# library code of ssg-sim or sgp4-portable. Tests may call them: the guard runs
# clippy with `--lib` and only this file; the workspace's own clippy run does
# not read it.
