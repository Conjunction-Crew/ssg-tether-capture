name: Release

# Manually triggered release pipeline: Actions → Release → Run workflow.
#
# Nothing is released by merging to main.  A maintainer runs this workflow and
# picks the bump level, and the pipeline does the rest:
#
#   1. prepare  Compute the next version, bump Cargo.toml/Cargo.lock, promote
#               CHANGELOG.md's [Unreleased] section, snapshot the versioned docs
#               (stable major/minor only) and push ONE release commit to a
#               scratch branch `release-staging/vX.Y.Z`.  main is NOT touched yet.
#   2. verify   cargo test on main (in parallel with prepare).
#   3. build    Linux / Windows / macOS packages from the staged commit.
#   4. publish  Only if everything above is green: fast-forward main to the
#               staged commit, push the vX.Y.Z tag, create the GitHub Release.
#   5. docs     Deploy the docs site (stable major/minor releases only).
#
# If any build fails, main is never modified — fix forward and run it again.
#
# Version rules (see scripts/next_version.sh):
#   current 0.3.0       + minor + stable → 0.4.0     + minor + rc → 0.4.0-rc.1
#   current 0.4.0-rc.1  + rc              → 0.4.0-rc.2
#   current 0.4.0-rc.2  + stable          → 0.4.0   (promotes the RC; `bump` ignored)
#
# One-time repository setup (see docs: Contributing → Release Workflow):
#   • A GitHub App with "Contents: read & write" installed on this repo, added as
#     a bypass actor on the `main` branch ruleset and on the `v*.*.*` tag ruleset.
#   • Repository variable RELEASE_APP_ID and secret RELEASE_APP_PRIVATE_KEY.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump (ignored when the current version is an -rc)
        type: choice
        options: [patch, minor, major]
        default: patch
      channel:
        description: stable = full release, rc = pre-release candidate
        type: choice
        options: [stable, rc]
        default: stable
      dry_run:
        description: Compute and validate everything, but push and publish nothing
        type: boolean
        default: false

# Never run two releases at once, and never cancel one half-way through.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Tests on the commit being released.
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify (fmt, test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Only main can be released
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Releases must be run from main (selected: ${GITHUB_REF_NAME}). Use dry_run to try other branches."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libasound2-dev libudev-dev

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          save-if: "false"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --locked

  # ───────────────────────────────────────────────────────────────────────────
  # Bump version, promote changelog, snapshot docs → one commit on a scratch
  # branch.
  # ───────────────────────────────────────────────────────────────────────────
  prepare:
    name: Prepare release commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version:        ${{ steps.version.outputs.version }}
      tag:            ${{ steps.version.outputs.tag }}
      is_prerelease:  ${{ steps.version.outputs.is_prerelease }}
      msi_version:    ${{ steps.version.outputs.msi_version }}
      snapshot_docs:  ${{ steps.version.outputs.snapshot_docs }}
      sha:            ${{ steps.commit.outputs.sha }}
    steps:
      - name: Only main can be released
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Releases must be run from main (selected: ${GITHUB_REF_NAME}). Use dry_run to try other branches."
          exit 1

      - name: Create GitHub App token
        id: app-token
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history + tags
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -eu
          CURRENT=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          VERSION=$(sh scripts/next_version.sh "$CURRENT" "$BUMP" "$CHANNEL")
          TAG="v${VERSION}"

          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "::error::Tag ${TAG} already exists."
            exit 1
          fi

          BASE=${VERSION%%-*}
          PATCH=$(echo "$BASE" | cut -d. -f3)
          case "$VERSION" in
            *-rc.*) IS_PRERELEASE=true;  SNAPSHOT_DOCS=false ;;
            *)      IS_PRERELEASE=false
                    if [ "$PATCH" = "0" ]; then SNAPSHOT_DOCS=true; else SNAPSHOT_DOCS=false; fi ;;
          esac

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "msi_version=$BASE"
            echo "snapshot_docs=$SNAPSHOT_DOCS"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Release ${TAG}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Current version | \`${CURRENT}\` |"
            echo "| Next version | \`${VERSION}\` (${CHANNEL}, bump: ${BUMP}) |"
            echo "| Pre-release | ${IS_PRERELEASE} |"
            echo "| Versioned docs snapshot | ${SNAPSHOT_DOCS} |"
            echo "| Dry run | ${{ inputs.dry_run }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bump Cargo.toml and Cargo.lock
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          # First `version = "..."` in the file is the [package] version.
          awk -v v="$VERSION" '!done && /^version = "/ { print "version = \"" v "\""; done = 1; next } { print }' \
            Cargo.toml > Cargo.toml.new
          mv Cargo.toml.new Cargo.toml
          cargo update --workspace

          # Cargo.lock must change by exactly the one package version line.
          CHANGED=$(git diff -U0 Cargo.lock | grep -E '^[+-][^+-]' | wc -l)
          if [ "$CHANGED" -ne 2 ]; then
            echo "::error::Unexpected Cargo.lock changes (${CHANGED} lines); expected only the package version."
            git diff Cargo.lock
            exit 1
          fi

      - name: Promote CHANGELOG.md [Unreleased] section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          sh scripts/prepare_changelog.sh "$VERSION"
          sh scripts/extract_release_notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          {
            echo ""
            echo "### Release notes"
            echo ""
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit version bump and changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): ${TAG}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.version.outputs.snapshot_docs == 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ./docs_site/package-lock.json

      - name: Snapshot versioned docs (stable major/minor)
        if: steps.version.outputs.snapshot_docs == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          cd docs_site
          npm ci
          # Written by CI only (gitignored): the snapshot should contain the
          # release notes for this version.
          cp ../CHANGELOG.md docs/release-notes.md
          npm pkg set version "$VERSION"
          npm run docusaurus -- docs:version "$VERSION"
          cd ..
          git add docs_site/versioned_docs docs_site/versioned_sidebars \
                  docs_site/package.json docs_site/package-lock.json docs_site/versions.json
          git commit -m "chore(docs): add versioned docs snapshot for v${VERSION}"
          # Enforce the 10-version cap (commits on its own if it prunes anything).
          sh scripts/prune_versioned_docs.sh

      - name: Record staged commit
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo ""
          git log --stat --format='%h %s' origin/${GITHUB_REF_NAME}..HEAD | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push staging branch
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --force origin "HEAD:refs/heads/release-staging/${TAG}"

  # ───────────────────────────────────────────────────────────────────────────
  # Build every platform from the staged commit.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build packages
    needs: [prepare, verify]
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/build-packages.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      label: ${{ needs.prepare.outputs.tag }}
      msi_version: ${{ needs.prepare.outputs.msi_version }}

  # ───────────────────────────────────────────────────────────────────────────
  # Land the release: fast-forward main, tag, publish the GitHub Release.
  # Idempotent, so "Re-run failed jobs" is safe after a partial failure.
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Fast-forward main to the release commit
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$SHA" ]; then
            echo "main is already at ${SHA} — nothing to do."
          elif git merge-base --is-ancestor origin/main "$SHA"; then
            git push origin "${SHA}:refs/heads/main"
          else
            echo "::error::main moved on since this release was prepared. Nothing was published; run the Release workflow again."
            exit 1
          fi

      - name: Create and push tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists on the remote — leaving it."
          else
            git tag -a "$TAG" "$SHA" -m "$TAG"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -eu
          sh scripts/extract_release_notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          ls -lR artifacts

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists — uploading assets only."
            gh release upload "$TAG" artifacts/* --clobber
          else
            if [ "$IS_PRERELEASE" = "true" ]; then FLAGS="--prerelease"; else FLAGS="--latest"; fi
            gh release create "$TAG" artifacts/* \
              --verify-tag \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              $FLAGS
          fi

      - name: Delete staging branch
        run: git push origin --delete "release-staging/${{ needs.prepare.outputs.tag }}" || true

  # ───────────────────────────────────────────────────────────────────────────
  # Deploy docs for stable major/minor releases (patch + rc releases do not
  # add a versioned docs set, so the live site stays as it is).
  # ───────────────────────────────────────────────────────────────────────────
  docs:
    name: Deploy docs
    needs: [prepare, publish]
    if: ${{ !inputs.dry_run && needs.prepare.outputs.snapshot_docs == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
