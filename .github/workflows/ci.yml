name: CI

# Fast pull-request gate.
#
#   PR / push to main : Linux fmt + clippy + tests (the real gate), plus a cheap
#                       `cargo check` on Windows and macOS.  Jobs are skipped
#                       when the PR does not touch the files they care about.
#   `full-ci` label   : also runs the full cargo build + test on Windows/macOS.
#   Weekday schedule  : the same full run, against main.
#   workflow_dispatch : the same full run, on demand.
#
# Branch protection should require ONLY the `ci-success` job.  Jobs skipped by
# the change detection below would otherwise leave required checks "pending".

on:
  pull_request:
    # `labeled`/`unlabeled` so adding `full-ci` or `no-changelog` re-runs CI.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless in CI and bloat the cache.
  CARGO_INCREMENTAL: "0"
  # The dev profile sets `debug = true`.  Debug info makes Windows link times
  # and cache sizes balloon (huge PDBs) and CI never needs it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Decide which jobs are relevant for this event.
  # ───────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      docs: ${{ steps.detect.outputs.docs }}
      full: ${{ steps.detect.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE_SHA"...HEAD)
            rust=false
            docs=false
            if printf '%s\n' "$files" | grep -Eq '^(src/|crates/|assets/|wix/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.cargo/config\.toml$|\.github/workflows/(ci|build-packages)\.yml$)'; then
              rust=true
            fi
            if printf '%s\n' "$files" | grep -Eq '^(docs_site/|CHANGELOG\.md$|\.github/workflows/ci\.yml$)'; then
              docs=true
            fi
            full=$HAS_FULL_LABEL
            if [ "$full" = "true" ]; then rust=true; fi
          else
            rust=true
            docs=true
            # push to main is a cheap warm-up/validation run; schedule and manual
            # runs get the full cross-platform build.
            if [ "$EVENT" = "push" ]; then full=false; else full=true; fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "rust=$rust docs=$docs full=$full"

  # ───────────────────────────────────────────────────────────────────────────
  # Linux: formatting, lints and the unit/integration tests.  This is the job
  # that actually gates a merge.
  # ───────────────────────────────────────────────────────────────────────────
  rust-linux:
    name: Lint and test (Linux)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libasound2-dev libudev-dev

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Remove other preinstalled toolchains
        # rust-cache hashes every installed toolchain into its key.  The set
        # preinstalled on the runner image changes between images (1.99.0 present
        # or not), so the key alternated and most PR runs missed the cache.  Only
        # the toolchain pinned by rust-toolchain.toml is kept (Q39, P5).
        shell: bash
        run: |
          set -eu
          active=$(rustup show active-toolchain | awk '{print $1}')
          echo "Active toolchain: $active"
          echo "Installed before:"
          rustup toolchain list
          rustup toolchain list | awk '{print $1}' | while read -r tc; do
            if [ "$tc" != "$active" ]; then rustup toolchain uninstall "$tc"; fi
          done
          echo "Installed after:"
          rustup toolchain list

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # PR caches are not shared between PRs and would evict the main-branch
          # cache (repo cache quota is 10 GB), so only main saves.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (gate)
        # Every clippy warning fails the job except these two Bevy-signature
        # lints, which the next step tracks until P3/P8 restructure the systems
        # and UI code that triggers them.  Never silence them with #[allow].
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::type_complexity -A clippy::too_many_arguments

      - name: ssg-sim has no render dependency
        # The simulation core must stay headless: none of the renderer, window,
        # UI or egui crates may appear in its normal dependency tree.
        # `bevy_window` is not listed: bevy_scene -> bevy_camera -> bevy_window
        # is a types-only chain that pulls no renderer.
        run: test "$(cargo tree -p ssg-sim -e normal --locked | grep -cE 'bevy_(render|winit|ui\b|pbr|gizmos|core_pipeline|post_process|egui)')" = 0

      - name: Clippy (tracked warnings report)
        # Lists the two allowed lints in the job summary.  Never fails.  The
        # short message format has no lint names, so match on the message text,
        # and `--color never` is needed because CARGO_TERM_COLOR=always would put
        # escape codes inside the `: warning:` marker.  It reuses the gate's build
        # artifacts.
        if: always()
        run: |
          cargo clippy --workspace --all-targets --locked --color never --message-format=short 2>&1 \
            | grep ': warning:' \
            | grep -E 'very complex type used|too many arguments' \
            | sed -E 's/^([^ ]+): warning: (.*)$/\1 \2/' \
            | sort -u > "$RUNNER_TEMP/tracked-clippy.txt" || true
          COUNT=$(wc -l < "$RUNNER_TEMP/tracked-clippy.txt" | tr -d ' ')
          echo "Tracked clippy warnings: ${COUNT}"
          {
            echo "### Tracked clippy warnings"
            echo ""
            echo "Tracked clippy warnings: ${COUNT}"
            echo ""
            echo "\`clippy::type_complexity\` and \`clippy::too_many_arguments\` are allowed by the gate and listed here until the files are restructured."
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/tracked-clippy.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sed -E 's/^([^:]+):([0-9]+):([0-9]+) (.*)$/::warning file=\1,line=\2,col=\3::\4/' \
            "$RUNNER_TEMP/tracked-clippy.txt" || true
          exit 0

      - name: Run tests
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"

      - name: Test execution time
        # Sum of the `finished in` lines of every test binary, printed to the job
        # summary and as an annotation (visible in `gh run view <id>`).
        if: success() || failure()
        run: |
          line=$(sh scripts/ci_test_time.sh "$RUNNER_TEMP/cargo-test.log" "$GITHUB_STEP_SUMMARY")
          echo "$line"
          echo "::notice title=Test execution time (Linux)::$line"

      - name: Determinism to capture (ignored tests)
        # `full` is true on the weekday schedule, manual runs and `full-ci` PRs
        # (the release PR always carries it), so these long tests check the code
        # before it is released.  Runs on every platform: it compares runs on the
        # same platform (see docs_site/docs/concepts/determinism.md).
        if: needs.changes.outputs.full == 'true'
        run: cargo test -p ssg-sim-cli --locked cli_three_runs_to_capture_identical -- --ignored --nocapture

      - name: Build (full runs only)
        if: needs.changes.outputs.full == 'true'
        run: cargo build --workspace --locked

  # ───────────────────────────────────────────────────────────────────────────
  # Line coverage of the workspace tests (cargo-llvm-cov), in parallel with
  # rust-linux so the uninstrumented test time stays the timing number.  Report
  # only until the gates are enforced (P5 S8); the report is uploaded as an
  # artifact.  Production code only: see scripts/coverage_gate.sh.
  # ───────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage (Linux)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libasound2-dev libudev-dev

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - name: Remove other preinstalled toolchains
        # Keeps the rust-cache key stable (see rust-linux).
        shell: bash
        run: |
          set -eu
          active=$(rustup show active-toolchain | awk '{print $1}')
          echo "Active toolchain: $active"
          echo "Installed before:"
          rustup toolchain list
          rustup toolchain list | awk '{print $1}' | while read -r tc; do
            if [ "$tc" != "$active" ]; then rustup toolchain uninstall "$tc"; fi
          done
          echo "Installed after:"
          rustup toolchain list

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.9.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The instrumented build lives in target/llvm-cov-target, not target.
          workspaces: ". -> target/llvm-cov-target"

      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --locked --no-report

      - name: Coverage reports
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --json --summary-only --output-path target/coverage/summary.json
          cargo llvm-cov report --lcov --output-path target/coverage/lcov.info
          cargo llvm-cov report --html --output-dir target/coverage

      - name: Coverage gates (report only)
        run: sh scripts/coverage_gate.sh target/coverage/summary.json "$GITHUB_STEP_SUMMARY" --report-only

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: target/coverage/
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # Windows / macOS.  PRs only run `cargo check` (compile errors, platform-
  # specific cfg code).  A `full-ci` label, the weekday schedule and manual
  # runs do the full build + test.  Release builds always cover both.
  # ───────────────────────────────────────────────────────────────────────────
  cross-platform:
    name: ${{ needs.changes.outputs.full == 'true' && 'Build and test' || 'Check' }} (${{ matrix.name }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Remove other preinstalled toolchains
        # rust-cache hashes every installed toolchain into its key.  The set
        # preinstalled on the runner image changes between images (1.99.0 present
        # or not), so the key alternated and most PR runs missed the cache.  Only
        # the toolchain pinned by rust-toolchain.toml is kept (Q39, P5).
        shell: bash
        run: |
          set -eu
          active=$(rustup show active-toolchain | awk '{print $1}')
          echo "Active toolchain: $active"
          echo "Installed before:"
          rustup toolchain list
          rustup toolchain list | awk '{print $1}' | while read -r tc; do
            if [ "$tc" != "$active" ]; then rustup toolchain uninstall "$tc"; fi
          done
          echo "Installed after:"
          rustup toolchain list

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # `cargo check` runs and full build-and-test runs need different
          # artifacts; with one key the check cache shadowed the build cache.
          key: ${{ needs.changes.outputs.full == 'true' && 'build' || 'check' }}

      - name: cargo check
        if: needs.changes.outputs.full != 'true'
        run: cargo check --workspace --all-targets --locked

      - name: cargo build
        if: needs.changes.outputs.full == 'true'
        run: cargo build --workspace --locked

      - name: cargo test
        if: needs.changes.outputs.full == 'true'
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"

      - name: Test execution time
        if: needs.changes.outputs.full == 'true' && (success() || failure())
        shell: bash
        run: |
          line=$(sh scripts/ci_test_time.sh "$RUNNER_TEMP/cargo-test.log" "$GITHUB_STEP_SUMMARY")
          echo "$line"
          echo "::notice title=Test execution time (${{ matrix.name }})::$line"

      - name: Determinism to capture (ignored tests)
        # Per-platform identity everywhere: three runs at 1x and one at 16x must
        # be bit-identical on the same platform.
        if: needs.changes.outputs.full == 'true'
        run: cargo test -p ssg-sim-cli --locked cli_three_runs_to_capture_identical -- --ignored --nocapture

      - name: macOS goldens to capture
        # The goldens hold on macOS/aarch64 only (Q29 as replaced, F-48): there
        # are no cross-platform goldens and no cfg branches in the tests.
        if: needs.changes.outputs.full == 'true' && runner.os == 'macOS'
        run: cargo test -p ssg-sim --locked baseline_q13_to_capture -- --ignored --nocapture

  # ───────────────────────────────────────────────────────────────────────────
  # Docusaurus build — catches broken links / build errors, and enforces the
  # 10-versioned-docs cap (see scripts/prune_versioned_docs.sh).
  # ───────────────────────────────────────────────────────────────────────────
  docs-build:
    name: Build docs site
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ./docs_site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./docs_site

      - name: Sync changelog into docs
        run: cp CHANGELOG.md ./docs_site/docs/release-notes.md

      - name: Build website
        run: npm run build
        working-directory: ./docs_site

      - name: Check versioned docs count (max 10)
        run: |
          COUNT=$(node -e "const v=require('./docs_site/versions.json'); console.log(v.length)")
          if [ "$COUNT" -gt 10 ]; then
            echo "ERROR: versions.json has $COUNT entries (max 10). Run scripts/prune_versioned_docs.sh to prune." >&2
            exit 1
          fi
          echo "Versioned docs count: $COUNT (OK)"

  # ───────────────────────────────────────────────────────────────────────────
  # Every PR must add a note under `## [Unreleased]` in CHANGELOG.md, unless it
  # only touches docs, carries the `no-changelog` label, or comes from Dependabot.
  # ───────────────────────────────────────────────────────────────────────────
  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md [Unreleased] section
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKIP_CHANGELOG_CHECK: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') || github.actor == 'dependabot[bot]' }}
        run: sh ./scripts/check_changelog.sh "$BASE_SHA"

  # ───────────────────────────────────────────────────────────────────────────
  # Single required status check.  Skipped jobs count as passing; failed or
  # cancelled ones do not.
  # ───────────────────────────────────────────────────────────────────────────
  ci-success:
    name: ci-success
    if: always()
    needs: [changes, rust-linux, coverage, cross-platform, docs-build, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*)
              echo "::error::One or more CI jobs failed or were cancelled."
              exit 1
              ;;
          esac
