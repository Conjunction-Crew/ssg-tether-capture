name: Deploy to GitHub Pages

# Builds the Docusaurus site and deploys it to GitHub Pages.
#
# Called by release.yml after every non-dry-run release. The permanent X.Y.0
# snapshots are committed by their releases; the two rolling versions (latest
# patch, latest pre-release) are built here from the release tags by
# scripts/docs_versions.sh and never committed (Q48).
#
# Manual redeploy of an existing release (dispatch from main: the github-pages
# environment only accepts deployments from main and release tags):
#   Actions → Deploy to GitHub Pages → Run workflow (branch: main) → ref = vX.Y.Z
# Build-only run, e.g. to check a branch: set deploy = false and, if ref is a
# branch, version = the release to plan for. The site is uploaded as the
# docs-site-preview artifact and the Pages deployment is skipped:
#   gh workflow run deploy-docs.yml --ref <branch> -f ref=<branch> \
#     -f version=0.4.0-rc.1 -f deploy=false

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (normally the release tag, e.g. v0.4.0) to build the site from.
        type: string
        required: true
      version:
        description: Release version the docs are built for (default is ref without a leading "v").
        type: string
        required: false
      deploy:
        description: Deploy to GitHub Pages. False builds only and uploads the site as an artifact.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (normally the release tag, e.g. v0.4.0) to build the site from.
        type: string
        required: true
      version:
        description: Release version the docs are built for (default is ref without a leading "v").
        type: string
        required: false
      deploy:
        description: Deploy to GitHub Pages. False builds only and uploads the site as an artifact.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # tags: the rolling versions are built from them

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ./docs_site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./docs_site

      - name: Sync changelog into docs
        # release-notes.md is gitignored — generated here at build time only.
        # Also synced into the versioned snapshot for this version so users
        # browsing it see the matching changelog.
        env:
          REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          cp CHANGELOG.md ./docs_site/docs/release-notes.md

          VERSION="${INPUT_VERSION:-${REF#v}}"
          VERSIONED_DIR="docs_site/versioned_docs/version-${VERSION}"
          if [ -d "$VERSIONED_DIR" ]; then
            cp CHANGELOG.md "${VERSIONED_DIR}/release-notes.md"
            echo "Synced changelog to ${VERSIONED_DIR}/release-notes.md"
          fi

      - name: Rolling docs versions
        # Latest patch and latest pre-release docs, built from the release tags
        # (never committed). Writes the version table to the run summary.
        env:
          REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          VERSION="${INPUT_VERSION:-${REF#v}}"
          sh scripts/docs_versions.sh apply "$VERSION" "$GITHUB_STEP_SUMMARY"

      - name: Verify versioned docs integrity
        env:
          REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          VERSION="${INPUT_VERSION:-${REF#v}}"
          if ! node -e "process.exit(require('./docs_site/versions.json').includes('${VERSION}') ? 0 : 1)"; then
            echo "ERROR: ${VERSION} is not in the final docs_site/versions.json." >&2
            exit 1
          fi
          # The cap applies to the committed list (permanent snapshots), not to
          # the two rolling versions added above.
          COUNT=$(git show HEAD:docs_site/versions.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).length))")
          if [ "$COUNT" -gt 10 ]; then
            echo "ERROR: the committed versions.json has $COUNT entries (max 10)." >&2
            exit 1
          fi
          echo "Versioned docs integrity check passed (${VERSION}, ${COUNT} committed versioned sets)."

      - name: Build website
        run: npm run build
        working-directory: ./docs_site

      - name: Upload Build Artifact
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs_site/build

      - name: Upload preview (build-only run)
        if: ${{ !inputs.deploy }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-preview
          path: ./docs_site/build
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ inputs.deploy }}
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
