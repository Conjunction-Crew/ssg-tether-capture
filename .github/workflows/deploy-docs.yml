name: Deploy to GitHub Pages

# Builds the Docusaurus site and deploys it to GitHub Pages.
#
# Called by release.yml after a stable major/minor release (the versioned docs
# snapshot is committed by the release itself, so the tag already contains it).
# Can also be run by hand to redeploy an existing release:
#   Actions → Deploy to GitHub Pages → Run workflow → ref = vX.Y.0

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (normally the release tag, e.g. v0.4.0) to build the site from.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (normally the release tag, e.g. v0.4.0) to build the site from.
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ./docs_site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./docs_site

      - name: Sync changelog into docs
        # release-notes.md is gitignored — generated here at build time only.
        # Also synced into the versioned snapshot for this version so users
        # browsing it see the matching changelog.
        env:
          REF: ${{ inputs.ref }}
        run: |
          cp CHANGELOG.md ./docs_site/docs/release-notes.md

          VERSION="${REF#v}"
          VERSIONED_DIR="docs_site/versioned_docs/version-${VERSION}"
          if [ -d "$VERSIONED_DIR" ]; then
            cp CHANGELOG.md "${VERSIONED_DIR}/release-notes.md"
            echo "Synced changelog to ${VERSIONED_DIR}/release-notes.md"
          fi

      - name: Verify versioned docs integrity
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -eu
          VERSION="${REF#v}"
          VERSIONED_DIR="docs_site/versioned_docs/version-${VERSION}"
          if [ ! -d "$VERSIONED_DIR" ]; then
            echo "ERROR: No versioned docs snapshot found at ${VERSIONED_DIR}." >&2
            echo "       Only stable major/minor releases (vX.Y.0) have one." >&2
            exit 1
          fi
          COUNT=$(node -e "const v=require('./docs_site/versions.json'); console.log(v.length)")
          if [ "$COUNT" -gt 10 ]; then
            echo "ERROR: versions.json has $COUNT entries (max 10)." >&2
            exit 1
          fi
          echo "Versioned docs integrity check passed (v${VERSION}, ${COUNT} versioned sets)."

      - name: Build website
        run: npm run build
        working-directory: ./docs_site

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs_site/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
