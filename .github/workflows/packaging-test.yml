name: Packaging Test

# Manual smoke test of the Linux/Windows/macOS packaging, using the same
# reusable workflow as real releases.  Nothing is published; download the
# artifacts from the run summary to try the installers.
#
# Run it from the Actions tab and pick the branch to package.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build packages
    uses: ./.github/workflows/build-packages.yml
    with:
      label: test-${{ github.run_id }}
