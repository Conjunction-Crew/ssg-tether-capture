name: Build packages

# Reusable workflow: builds the distributable packages for every platform.
#   Linux x86_64   → .tar.gz   (binary + assets/)
#   Windows x86_64 → .msi      (WiX)
#   macOS ARM64    → .dmg      (ad-hoc signed .app bundle)
#
# Called by release.yml (real releases) and packaging-test.yml (manual smoke
# test).  Artifacts are uploaded as `linux`, `windows` and `macos`.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (branch, tag or SHA) to build.  Defaults to the caller's ref.
        type: string
        default: ""
      label:
        description: Label embedded in the package file names, e.g. v1.2.3 or a run id.
        type: string
        required: true
      msi_version:
        description: >-
          MSI PackageVersion (Major.Minor.Build, no pre-release label).  When empty,
          the default in wix/SSG.wixproj is used.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Linux build → tar.gz
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libasound2-dev libudev-dev

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          prefix-key: release-v0
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tar.gz
        env:
          LABEL: ${{ inputs.label }}
        run: |
          ARCHIVE="ssg-tether-capture-${LABEL}-linux-x86_64.tar.gz"
          mkdir -p dist
          cp target/release/ssg_tether_capture dist/
          cp -r assets dist/
          tar -C dist -czf "$ARCHIVE" .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Windows build → .msi
  #
  # WiX is driven through the SDK-style wix/SSG.wixproj.  assets/ is harvested
  # at build time to avoid maintaining a static file list in source control.
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET (for WiX SDK)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          prefix-key: release-v0
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build MSI (dotnet / WiX SDK)
        shell: pwsh
        env:
          LABEL: ${{ inputs.label }}
          MSI_VERSION: ${{ inputs.msi_version }}
        run: |
          $props = @()
          if ($env:MSI_VERSION) {
            Write-Host "Package version: $env:MSI_VERSION"
            $props += "-p:PackageVersion=$env:MSI_VERSION"
          }

          dotnet restore wix/SSG.wixproj
          dotnet build wix/SSG.wixproj -c Release @props

          $msiFile = Get-ChildItem -Path . -Recurse -Filter "*.msi" | Select-Object -First 1
          if (-not $msiFile) {
            Write-Error "MSI not found after dotnet build."
            exit 1
          }
          $destName = "ssg-tether-capture-$($env:LABEL)-windows-x86_64.msi"
          $destPath = Join-Path (Split-Path $msiFile.FullName) $destName
          if ($msiFile.FullName -ne $destPath) {
            Copy-Item -Path $msiFile.FullName -Destination $destPath -Force
          }
          Write-Host "MSI: $destPath"
          Add-Content -Path $env:GITHUB_ENV -Value "MSI=$destPath"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: ${{ env.MSI }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # macOS build → .dmg
  #
  # cargo-bundle creates a .app with the binary + assets inside
  # Contents/Resources/.  hdiutil wraps the .app in a compressed DMG.
  #
  # NOTE: The .app is ad-hoc signed only.  Users on macOS 13+ must right-click →
  # Open (or allow it in System Settings → Privacy & Security) on first launch.
  # Add Apple Developer ID signing here when a certificate is available.
  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build (macOS ARM64)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          prefix-key: release-v0
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-bundle
        run: |
          if ! cargo-bundle --version 2>/dev/null | grep -qF "0.6.1"; then
            cargo install cargo-bundle --version "0.6.1" --force
          fi

      - name: Build and bundle .app
        run: cargo bundle --release

      - name: Verify bundle
        run: |
          APP_PATH="target/release/bundle/osx/SSG Tether Capture.app"
          BIN="$APP_PATH/Contents/MacOS/ssg_tether_capture"
          if [ ! -f "$BIN" ]; then
            echo "Binary not found inside app bundle!"
            ls -la "target/release/bundle" || true
            ls -la "$APP_PATH/Contents/MacOS" || true
            exit 1
          fi
          file "$BIN"
          otool -L "$BIN"

      - name: Ad-hoc sign .app
        run: |
          APP_PATH="target/release/bundle/osx/SSG Tether Capture.app"
          # Ad-hoc signing (-) needs no Apple Developer account but stops
          # Gatekeeper from reporting the downloaded app as "damaged".  Sign the
          # binary first, then the bundle wrapper (order matters).
          codesign --force --deep --sign - --options runtime \
            "$APP_PATH/Contents/MacOS/ssg_tether_capture"
          codesign --force --deep --sign - --options runtime "$APP_PATH"
          codesign --verify --verbose "$APP_PATH"

      - name: Package DMG
        env:
          LABEL: ${{ inputs.label }}
        run: |
          APP_PATH="target/release/bundle/osx/SSG Tether Capture.app"
          case "$(uname -m)" in
            x86_64) ARCH_LABEL="x86_64" ;;
            arm64)  ARCH_LABEL="arm64" ;;
            *)      ARCH_LABEL="$(uname -m)" ;;
          esac
          DMG="ssg-tether-capture-${LABEL}-macos-${ARCH_LABEL}.dmg"

          hdiutil create \
            -volname "SSG Tether Capture" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "$DMG"

          if [ ! -f "$DMG" ]; then
            echo "DMG not created!"
            ls -la
            exit 1
          fi
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: ${{ env.DMG }}
          if-no-files-found: error
